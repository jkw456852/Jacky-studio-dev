name: Sync GPT Image Inspiration

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gpt-image-inspiration
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh inspiration data
        run: node scripts/sync-gpt-image-inspiration.mjs

      - name: Commit refreshed data
        shell: bash
        run: |
          if git diff --quiet -- public/runtime-assets/gpt-image-inspiration.json; then
            echo "Inspiration data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/runtime-assets/gpt-image-inspiration.json
          git commit -m "chore: refresh GPT image inspiration"
          git push
